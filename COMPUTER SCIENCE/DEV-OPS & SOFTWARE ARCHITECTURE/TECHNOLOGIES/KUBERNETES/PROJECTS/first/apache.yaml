apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-app
  labels:
    app: apache-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: apache-app
  template:
    metadata:
      labels:
        app: apache-app
    spec:
      containers:
      - name: apache
        image: httpd:alpine
        ports:
        - name: "http"
          containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
spec:
  type: NodePort
  selector:
    app: apache-app
  ports:
    - name: "http"
      port: 80
      targetPort: 80
